ext.Nexconn = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return Nexconn[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.nexconn"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

// Resolves the SDK for this module. Gradle resolves the app's own classpath
// with the app's repositories, so consumers must declare this repository too
// (the Expo config plugin does that; see the README for Community CLI apps).
repositories {
  maven { url "https://maven.nexconn.ai/repository/maven-releases/" }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "ai.nexconn.chat:chat:26.4.2"
}
