# Render blueprint for the demo token server (examples/token-server).
# New > Blueprint in the Render dashboard, pick this repository, then fill in
# the three secret values when Render asks. Secrets live only in Render.
services:
  - type: web
    name: nexconn-token-server
    runtime: node
    plan: free
    rootDir: examples/token-server
    buildCommand: "true"
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXCONN_API_BASE
        value: https://api.sg-light-api.com
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: DEMO_USERS
        sync: false
