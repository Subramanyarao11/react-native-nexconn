name: Release
# Publishes to npm when a GitHub release is published. Needs an NPM_TOKEN
# secret (an npm automation token for the @subramanyarao11 scope).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs check
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME != $version"; exit 1; }
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest; case "$version" in *-*) tag=beta;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
