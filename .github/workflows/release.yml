name: Release
# Publishes to npm when a GitHub release is published. Needs an NPM_TOKEN
# secret (a granular npm token for @subramanyarao11/react-native-nexconn with
# publish rights). Releases marked "pre-release" go to the `next` dist-tag;
# all others go to `latest`. Already-published versions are skipped.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs check
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME != $version"; exit 1; }
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          # npm requires an explicit tag for prerelease versions. While the
          # package is pre-1.0, a beta is the newest release, so it goes to
          # `latest` unless the GitHub release is marked as a pre-release.
          tag=latest
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then tag=next; fi
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
